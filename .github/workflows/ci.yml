name: CI

# Lightweight sanity check only — does NOT gate or block pushes to main.
# This repo is iterated on fast and deployed straight from main; the point of this
# workflow is to surface a broken server.js in the GitHub Actions tab before Railway
# picks it up, not to require green CI before merging.

on:
  push:
  pull_request:

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check every shipped module
        run: for f in *.js; do echo "Checking $f"; node --check "$f"; done

      # Adding a module takes three edits: the require, a Dockerfile COPY, and an
      # entry in .dockerignore (which is deny-all with a per-file allowlist).
      # Missing either of the last two builds a container that crash-loops on
      # MODULE_NOT_FOUND or fails to build at all — it took the service down once.
      - name: Every required local module is actually shipped
        run: |
          fail=0
          for m in $(grep -ho "require('\./[a-zA-Z0-9_-]*')" *.js \
                     | sed "s/require('\.\///;s/')//" | sort -u); do
            [ -f "$m.js" ] || { echo "::error::$m.js is required but missing"; fail=1; continue; }
            grep -q "^COPY $m\.js " Dockerfile \
              || { echo "::error file=Dockerfile::no COPY line for $m.js"; fail=1; }
            grep -q "^!$m\.js$" .dockerignore \
              || { echo "::error file=.dockerignore::$m.js not in the allowlist"; fail=1; }
          done
          exit $fail

      - name: Verify each app entry point is well-formed HTML
        run: |
          for f in app/*/index.html; do
            echo "Checking $f"
            if ! grep -q "<html" "$f"; then
              echo "::error file=$f::missing <html> tag"
              exit 1
            fi
          done

      # NOTE: server.js hardcodes DATA_DIR=/data and APP_DIR=/app (Railway container
      # paths), which standard GitHub-hosted runners can't create without sudo — so we
      # deliberately don't boot the server here. If those paths ever become configurable
      # via env vars, add a real /globe smoke test.
