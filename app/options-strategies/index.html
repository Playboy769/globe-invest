<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>期權交易策略大全 · 互動學習</title>
<style>
:root{
  --ink:#111827;--ink2:#374151;--mute:#6b7280;--line:#e5e7eb;--bg:#fff;--soft:#f9fafb;
  --pos:#15803d;--neg:#b91c1c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.top{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:30;flex-wrap:wrap}
.top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 14px;font-weight:700;font-size:14px}
nav.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.prog-top{margin-left:auto;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
.bar{width:120px;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;padding:16px 16px 60px}
.view{display:none}.view.on{display:block}
.intro{color:var(--ink2);font-size:14px;margin:0 0 14px}

.cat-layout{display:grid;grid-template-columns:292px 1fr;gap:22px;align-items:start}
@media(max-width:900px){.cat-layout{grid-template-columns:1fr}.side{display:none}.side.open{display:block}}
.side{position:sticky;top:58px;max-height:calc(100vh - 70px);overflow:auto;padding-right:6px}
@media(max-width:900px){.side{position:static;max-height:60vh;border:1px solid var(--line);border-radius:10px;padding:10px}}
#side-toggle{display:none;border:1px solid var(--line);border-radius:6px;background:#fff;padding:6px 12px;margin-bottom:10px;font-weight:700}
@media(max-width:900px){#side-toggle{display:inline-block}}
.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;margin-bottom:10px}
.cat-block{margin-bottom:14px}
.cat-title{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;padding:4px 10px;border-left:5px solid var(--c);color:var(--c);background:var(--soft);border-radius:0 6px 6px 0}
.cat-title small{color:var(--mute);font-weight:500}
.cat-bar{height:3px;background:var(--line);margin:2px 0 4px}.cat-bar i{display:block;height:100%;background:var(--c)}
.slist{display:flex;flex-direction:column;gap:2px}
.sbtn{text-align:left;border:1px solid transparent;background:#fff;border-radius:8px;padding:5px 10px;line-height:1.35;display:flex;justify-content:space-between;gap:8px;width:100%}
.sbtn:hover{background:var(--soft)}
.sbtn.on{border-color:var(--c);background:var(--soft);box-shadow:inset 3px 0 0 var(--c)}
.sbtn b{display:block;font-size:14px}.sbtn span{font-size:12px;color:var(--mute)}
.sbtn em{font-style:normal;font-size:11px;color:var(--pos);font-weight:700;align-self:center;white-space:nowrap}
.sbtn u{text-decoration:none;font-size:11px;color:#b45309;font-weight:700;margin-left:6px}

.dhead{border-left:6px solid var(--c);padding:2px 0 2px 14px;margin-bottom:10px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.dhead h2{margin:0;font-size:25px;line-height:1.3}
.dhead h2 small{font-size:15px;color:var(--mute);font-weight:500;margin-left:8px}
.dhead p{margin:4px 0 0;color:var(--ink2);max-width:760px}
.dact{display:flex;gap:6px;flex-wrap:wrap}
.dact button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 12px;font-size:13px;font-weight:700}
.dact button.done{background:var(--pos);border-color:var(--pos);color:#fff}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.bd{font-size:12px;font-weight:700;border:1px solid var(--c);color:var(--c);border-radius:999px;padding:1px 10px;background:#fff}
.bd.g{--c:#6b7280}.bd.o{--c:#b45309}

.subtabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto}
.subtabs button{border:0;background:none;padding:8px 14px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--c)}
.panel{display:none}.panel.on{display:block}

.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;background:#fff}
.card h3{margin:0 0 8px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:760px){.facts{grid-template-columns:repeat(2,1fr)}}
.fact{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft)}
.fact small{display:block;color:var(--mute);font-size:12px}
.fact b{font-size:16px}
.pos{color:var(--pos)}.neg{color:var(--neg)}

.params{position:sticky;top:50px;z-index:10;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.params.hide{display:none}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px}
.ctl label{font-size:12px;color:var(--mute);display:block}
.ctl .row{display:flex;align-items:center;gap:8px}
.ctl input[type=range]{flex:1;accent-color:var(--c);min-width:0}
.ctl output{min-width:44px;text-align:right;font-weight:700;font-size:13px}
.ptools{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.ptools button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 10px;font-size:12px}
select,input[type=number]{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;background:#fff}
.stagebar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.stagebar button{border:1px solid var(--c);border-radius:8px;background:#fff;padding:3px 12px;font-weight:700;color:var(--c)}
.stagebar button.on{background:var(--c);color:#fff}
.chartbox{border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff}
svg.ch{width:100%;height:auto;display:block;touch-action:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:6px 8px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.hov{font-size:13px;margin:4px 8px;min-height:22px;color:var(--ink2)}

table.legs,table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.legs th,table.legs td,table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.legs th,table.tb th{color:var(--mute);font-weight:600;font-size:12px;background:var(--soft)}
table.tb th.sort{cursor:pointer;user-select:none}
table.tb th.sort:hover{color:var(--ink)}
.tag{display:inline-block;border-radius:5px;padding:0 7px;font-size:12px;font-weight:700;color:#fff}
.tag.buy{background:var(--pos)}.tag.sell{background:var(--neg)}
ul.pl{margin:0;padding-left:20px}ul.pl li{margin:4px 0}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 10px 8px 44px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
ol.steps li::before{content:counter(s);position:absolute;left:10px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;text-align:center;line-height:24px;font-size:13px}
.pros li::marker{color:var(--pos)}.cons li::marker{color:var(--neg)}
.warn{background:#f9fafb;border:1px solid var(--ink2);border-radius:10px;padding:10px 14px;color:var(--ink)}
.formula{font-family:Consolas,monospace;background:var(--soft);border-radius:6px;padding:1px 6px;font-size:13px}
.gk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.gk{grid-template-columns:repeat(2,1fr)}}
.gk div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
.gk small{display:block;color:var(--mute);font-size:12px}
.gk b{font-size:15px}
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.flow .st{flex:1;min-width:150px;border:2px solid var(--c);border-radius:10px;padding:8px 10px;background:#fff}
.flow .ar{align-self:center;font-size:20px;color:var(--mute)}
textarea.note{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;resize:vertical}
.mkchip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#111;color:#fff;font-size:12px;font-weight:800}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff;font-weight:700}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rec{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:10px 14px;margin-bottom:10px;background:#fff;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rec b{font-size:16px}.rec p{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
.rec button{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:4px 14px}
.mini{width:150px;height:60px;flex:none}

.fbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.fbar input,.fbar select{padding:5px 8px}
.cmpwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.cmpwrap table.tb tr:hover td{background:var(--soft);cursor:pointer}

.basic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.glos dt{font-weight:800;margin-top:10px}.glos dd{margin:2px 0 0;color:var(--ink2)}
footer{color:var(--mute);font-size:12.5px;text-align:center;padding:30px 16px;border-top:1px solid var(--line)}
.kbd{font-family:Consolas,monospace;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--soft);font-size:12px}
@media print{.top,.side,.params,.dact{display:none}.cat-layout{display:block}.panel{display:block!important}}
</style>
</head>
<body>
<header class="top">
  <h1>期權交易策略大全</h1>
  <nav class="tabs">
    <button data-v="cat" class="on">策略圖鑑</button>
    <button data-v="cmp">對比表</button>
    <button data-v="pick">策略選擇器</button>
    <button data-v="basic">基礎觀念</button>
  </nav>
  <div class="prog-top"><span id="prog-txt"></span><div class="bar"><i id="prog-bar" style="width:0"></i></div></div>
</header>
<div class="wrap">
  <section id="v-cat" class="view on">
    <button id="side-toggle">策略清單</button>
    <div class="cat-layout">
      <aside class="side" id="side"></aside>
      <main id="detail"></main>
    </div>
  </section>
  <section id="v-cmp" class="view">
    <p class="intro">以目前參數（現價、IV、天數、履約價間距）重新計算全部策略。點表頭排序，點列開啟詳解。</p>
    <div class="fbar" id="cmp-filter"></div>
    <div class="cmpwrap"><table class="tb" id="cmp-table"></table></div>
  </section>
  <section id="v-pick" class="view">
    <div class="card">
      <h3>步驟一：你對行情的看法</h3><div class="chips" id="pk-out"></div>
      <h3>步驟二：目前隱含波動率（IV）水位</h3><div class="chips" id="pk-iv"></div>
      <h3>步驟三：風險偏好</h3><div class="chips" id="pk-risk"></div>
    </div>
    <div id="pk-res"></div>
  </section>
  <section id="v-basic" class="view"></section>
</div>
<footer>僅供教學與資訊參考，非投資建議。模型為 Black-Scholes（歐式、無股息），實際報價因買賣價差、波動率偏斜與稅費而異。<br>
快捷鍵：<span class="kbd">/</span> 搜尋　<span class="kbd">j</span> 下一個策略　<span class="kbd">k</span> 上一個策略　<span class="kbd">1</span>–<span class="kbd">5</span> 切換分頁</footer>
<script>
'use strict';
/* ============ 分類 ============ */
const CATS=[
 {id:'bull',n:'看漲策略',en:'Bullish',c:'#15803d'},
 {id:'bear',n:'看跌策略',en:'Bearish',c:'#b91c1c'},
 {id:'yield',n:'收租策略',en:'Yield',c:'#b45309'},
 {id:'hedge',n:'保護 / 對沖策略',en:'Hedging',c:'#6d28d9'},
 {id:'neutral',n:'震盪 / 區間策略',en:'Neutral / Range',c:'#1d4ed8'},
 {id:'vol',n:'波動率 / 時間價值策略',en:'Volatility / Time',c:'#0f766e'}
];
const buy=(t,k=0,q=1,o={})=>({s:1,t,k,q,...o});
const sell=(t,k=0,q=1,o={})=>({s:-1,t,k,q,...o});
const stk=(cost=0)=>({s:1,t:'S',k:cost,q:1});

/* ============ 策略資料 ============
 legs: k = 與 ATM 履約價的距離（單位＝履約價間距）；stock 的 k = 成本相對 ATM 的位移
 far:true = 遠月（天數為近月的 3 倍） */
const ST=[
{id:'long-call',cat:'bull',en:'Long Call',zh:'買Call',star:1,outlooks:['strongUp'],iv:'buy',risk:'limited',
 lead:'最單純的看多：付權利金，換取「標的上漲」的無限獲利空間，最大虧損就是權利金。',
 setup:'買進 1 口 Call（常選平價或小幅價外）。',
 when:'預期短期內有明確、強勢的上漲催化（財報、政策、技術突破），且 IV 不高。',
 legs:[buy('C',0)],
 mp:'無限（標的越漲賺越多）',ml:'已付權利金',be:'履約價 ＋ 權利金',
 pros:['風險有限、槓桿高','無需保證金','操作與理解最簡單'],
 cons:['時間價值每天流失（Theta 為負）','方向對但漲太慢也會虧','IV 高時買貴，IV 下降（IV Crush）會傷害'],
 tips:['常見錯誤：買到期日太近的深度價外 Call，勝率極低。','原則：到期日留足 30–60 天，Delta 約 0.4–0.6。','財報前 IV 偏高，財報後 IV 崩落，方向對也可能賠。'],
 exit:'獲利達 50–100% 分批停利；虧損達權利金 50% 或論點失效即停損；到期前 1–2 週避免持有時間價值極低的部位。'},
{id:'bull-call',cat:'bull',en:'Bull Call Spread',zh:'牛市看漲期權價差',star:1,outlooks:['mildUp'],iv:'neutral',risk:'limited',
 lead:'買低履約價 Call、賣高履約價 Call：用賣出的 Call 抵掉一部分成本，換成有限的獲利上限。',
 setup:'買進較低履約價 Call ＋ 賣出較高履約價 Call（同到期日、同張數）。',
 when:'溫和看漲，預期漲到某個目標價位附近而不是飆太多。',
 legs:[buy('C',0),sell('C',2)],
 mp:'價差寬度 − 淨支出',ml:'淨支出（權利金差）',be:'低履約價 ＋ 淨支出',
 pros:['成本低於單買 Call','最大虧損明確','Vega 與 Theta 影響較單買小'],
 cons:['獲利有上限','漲過高履約價後等於放棄超額報酬'],
 tips:['價差寬度越大，潛在報酬與成本都越大。','賣出的高履約價可設在你認為的「合理目標價」。'],
 exit:'標的接近高履約價時多半已吃到大部分獲利，可提前平倉；不必死守到期。'},
{id:'bull-put',cat:'bull',en:'Bull Put Spread',zh:'牛市看跌期權價差',star:1,outlooks:['mildUp','income'],iv:'sell',risk:'limited',
 lead:'賣高履約價 Put、買低履約價 Put 當保險：先收權利金，只要不大跌就賺。',
 setup:'賣出較高履約價 Put ＋ 買進較低履約價 Put（同到期日）。',
 when:'看漲或「至少不跌」，IV 偏高時（賣方有利）。',
 legs:[sell('P',0),buy('P',-2)],
 mp:'淨收入（權利金）',ml:'價差寬度 − 淨收入',be:'高履約價 − 淨收入',
 pros:['先收權利金，Theta 站在你這邊','勝率通常高','風險有限（有買保險）'],
 cons:['獲利有上限，風險報酬比通常不對稱（賺小賠大）','急跌時虧損可達最大值','提前被指派風險（美式）'],
 tips:['常見錯誤：只看勝率高就把部位放太大，一次大跌賠光多次收益。','賣的履約價設在支撐位下方。'],
 exit:'收到的權利金賺進 50–70% 就可平倉，不必等到期；跌破支撐則停損。'},
{id:'syn-long',cat:'bull',en:'Synthetic Long',zh:'合成多頭',outlooks:['strongUp'],iv:'neutral',risk:'unlimited',
 lead:'買 Call ＋ 賣 Put（同履約價、同到期日），損益幾乎等同持有標的，但只需保證金。',
 setup:'買進 1 口 Call ＋ 賣出 1 口 Put，履約價與到期日相同。',
 when:'極度看漲且想用槓桿持有標的、或標的無法融資/放空時。',
 legs:[buy('C',0),sell('P',0)],
 mp:'無限',ml:'接近標的歸零（巨大）',be:'履約價 ＋ 淨支出（或 − 淨收入）',
 pros:['槓桿大、成本幾乎為零','等同期貨多單的損益形狀'],
 cons:['下跌時虧損與持股一樣大','賣 Put 需保證金','被指派時需接股'],
 tips:['Put-Call Parity：Call − Put ≈ 標的價 − 履約價現值。','這是「裸」風險，務必設好停損。'],
 exit:'等同期貨：設價格停損，而非等到期。'},
{id:'risk-rev',cat:'bull',en:'Risk Reversal',zh:'多頭風險逆轉',outlooks:['strongUp'],iv:'neutral',risk:'unlimited',
 lead:'賣出價外 Put 的權利金，來買價外 Call：成本近乎零的看多，但承擔下跌風險。',
 setup:'賣出較低履約價 Put ＋ 買進較高履約價 Call（同到期日、不同履約價）。',
 when:'強烈看多，且願意在較低價位接股（Put 被指派也不排斥）。',
 legs:[sell('P',-2),buy('C',2)],
 mp:'無限',ml:'低履約價 − 淨收入（標的歸零時巨大）',be:'視淨權利金；中間區間約為零成本平坦帶',
 pros:['成本低甚至可收錢','保留上檔無限獲利'],
 cons:['中間有一段「不賺不賠」區','下跌風險等同持股','Put 端需保證金'],
 tips:['波動率偏斜（Skew）下，價外 Put 通常較貴，常可零成本甚至收錢。','與 Collar 相反：Collar 是持股後買 Put 賣 Call 保護。'],
 exit:'跌破低履約價前先評估是否接股，否則平倉。'},

{id:'long-put',cat:'bear',en:'Long Put',zh:'買Put',star:1,outlooks:['strongDown'],iv:'buy',risk:'limited',
 lead:'最單純的看空：付權利金，標的下跌就賺，最大虧損僅為權利金。',
 setup:'買進 1 口 Put。',
 when:'預期強烈下跌（技術破位、利空），也可作為持股避險。',
 legs:[buy('P',0)],

/* ============ 定價與損益 ============ */
const R_FREE=0.015;
const ncdf=x=>{const t=1/(1+0.2316419*Math.abs(x)),d=0.3989423*Math.exp(-x*x/2);
 const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p;};
const npdf=x=>Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
function bs(S,K,T,sig,type){
  if(T<=1e-9||sig<=0){return type==='C'?Math.max(S-K,0):Math.max(K-S,0);}
  const r=R_FREE,sq=sig*Math.sqrt(T),d1=(Math.log(S/K)+(r+sig*sig/2)*T)/sq,d2=d1-sq;
  return type==='C'?S*ncdf(d1)-K*Math.exp(-r*T)*ncdf(d2):K*Math.exp(-r*T)*ncdf(-d2)-S*ncdf(-d1);
}
function greeksOf(S,K,T,sig,type){
  const r=R_FREE,sq=sig*Math.sqrt(T),d1=(Math.log(S/K)+(r+sig*sig/2)*T)/sq,d2=d1-sq;
  const delta=type==='C'?ncdf(d1):ncdf(d1)-1,gamma=npdf(d1)/(S*sq),vega=S*npdf(d1)*Math.sqrt(T)/100;
  const th=(-(S*npdf(d1)*sig)/(2*Math.sqrt(T))-(type==='C'?1:-1)*r*K*Math.exp(-r*T)*(type==='C'?ncdf(d2):ncdf(-d2)))/365;
  return {delta,gamma,vega,theta:th};
}

const P={S:100,iv:25,days:30,step:5,mult:1,f:0.5};

function build(st,stage=0){return buildLegs(st.stages?st.stages[stage].legs:st.legs);}
function buildLegs(legsDef){
  const base=Math.round(P.S/P.step)*P.step,Tn=P.days/365,Tf=Tn*3,sig=P.iv/100;
  const legs=legsDef.map(l=>{
    const o={...l};
    if(l.t==='S'){o.cost=base+l.k*P.step;o.price=0;}
    else{o.K=base+l.k*P.step;o.T0=l.far?Tf:Tn;o.price=bs(P.S,o.K,o.T0,sig,l.t);}
    return o;});
  return {legs,base,Tn,Tf,sig};
}
function legVal(o,S,f,B){
  const T=o.far?(B.Tf-B.Tn)+f*B.Tn:f*B.Tn;return bs(S,o.K,T,B.sig,o.t);
}
function pnl(B,S,f){
  let t=0;for(const o of B.legs){
    if(o.t==='S')t+=o.s*o.q*(S-o.cost);
    else t+=o.s*o.q*(legVal(o,S,f,B)-o.price);}
  return t;
}
function stats(B,N=4000){
  const hi=P.S*4,xs=[],ys=[];
  for(let i=0;i<=N;i++){const x=hi*(0.0005+i/N);xs.push(x);ys.push(pnl(B,x,0));}
  let mx=-1e18,mn=1e18;for(const y of ys){if(y>mx)mx=y;if(y<mn)mn=y;}
  const slope=(ys[N]-ys[N-40])/(xs[N]-xs[N-40]);
  const unlProfit=slope>1e-4,unlLoss=slope<-1e-4;
  const be=[];for(let i=1;i<=N;i++){if((ys[i-1]<0&&ys[i]>=0)||(ys[i-1]>0&&ys[i]<=0)){
    const t=ys[i-1]/(ys[i-1]-ys[i]);be.push(xs[i-1]+t*(xs[i]-xs[i-1]));}}
  return {mx,mn,unlProfit,unlLoss,be};
}
function netPrem(B){let t=0;for(const o of B.legs){if(o.t!=='S')t+=o.s*o.q*o.price;}return t;}
function netGreeks(B){
  const g={delta:0,gamma:0,theta:0,vega:0};
  for(const o of B.legs){
    if(o.t==='S'){g.delta+=o.s*o.q;continue;}
    const gg=greeksOf(P.S,o.K,o.T0,B.sig,o.t);
    for(const k in g)g[k]+=o.s*o.q*gg[k];
  }
  return g;
}

function fmt(n,d=2){if(!isFinite(n))return n>0?'無限':'無限';return Math.abs(n)>=1000?n.toLocaleString('en-US',{maximumFractionDigits:0}):n.toFixed(d);}

/* ============ 圖表 ============ */
function chartSVG(B,c,o={}){
  const mini=!!o.mini,W=o.W||760,H=o.H||380;
  const padL=mini?4:58,padR=mini?4:20,padT=mini?4:24,padB=mini?4:34;
  const x0=P.S*0.7,x1=P.S*1.3,N=mini?60:160;
  const exp=[],th=[];let lo=0,hi=0;
  for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N,a=pnl(B,x,0),b=mini?a:pnl(B,x,P.f);
    exp.push([x,a]);th.push([x,b]);lo=Math.min(lo,a,b);hi=Math.max(hi,a,b);}
  if(hi===lo){hi=1;lo=-1;}const pad=(hi-lo)*0.14;lo-=pad;hi+=pad;
  const X=x=>padL+(x-x0)/(x1-x0)*(W-padL-padR),Y=y=>padT+(hi-y)/(hi-lo)*(H-padT-padB),y0=Y(0);
  const path=a=>a.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  const area=path(exp)+`L${X(x1)} ${y0}L${X(x0)} ${y0}Z`;
  const id='c'+Math.random().toString(36).slice(2,7);
  let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" data-w="${W}" data-h="${H}" data-x0="${x0}" data-x1="${x1}" data-lo="${lo}" data-hi="${hi}">`;
  s+=`<defs><clipPath id="${id}u"><rect x="0" y="0" width="${W}" height="${Math.max(0,y0)}"/></clipPath><clipPath id="${id}d"><rect x="0" y="${y0}" width="${W}" height="${H}"/></clipPath></defs>`;
  if(!mini){
    for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);
      s+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#eef0f3"/><text x="${padL-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#6b7280">${fmt(v*P.mult,0)}</text>`;}
    for(let i=0;i<=6;i++){const v=x0+(x1-x0)*i/6;
      s+=`<text x="${X(v)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#6b7280">${v.toFixed(0)}</text>`;}
  }
  s+=`<path d="${area}" fill="#16a34a" opacity=".16" clip-path="url(#${id}u)"/><path d="${area}" fill="#dc2626" opacity=".16" clip-path="url(#${id}d)"/>`;
  s+=`<line x1="${padL}" x2="${W-padR}" y1="${y0}" y2="${y0}" stroke="#111" stroke-width="1.2"/>`;
  if(!mini){
    s+=`<path d="${path(th)}" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-dasharray="6 5"/>`;
    s+=`<line x1="${X(P.S)}" x2="${X(P.S)}" y1="${padT}" y2="${H-padB}" stroke="#374151" stroke-dasharray="2 4"/><text x="${X(P.S)}" y="${padT-8}" text-anchor="middle" font-size="11" fill="#374151">現價 ${P.S}</text>`;
    for(const o2 of B.legs){if(o2.t==='S'||o2.K<x0||o2.K>x1)continue;
      s+=`<line x1="${X(o2.K)}" x2="${X(o2.K)}" y1="${H-padB}" y2="${H-padB-8}" stroke="${o2.s>0?'#15803d':'#b91c1c'}" stroke-width="3"/>`;}
  }
  s+=`<path d="${path(exp)}" fill="none" stroke="${c}" stroke-width="${mini?2:3}" stroke-linejoin="round"/>`;
  if(!mini){
    for(const b of stats(B,1500).be){if(b<x0||b>x1)continue;
      s+=`<circle cx="${X(b)}" cy="${y0}" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/><text x="${X(b)}" y="${y0-10}" text-anchor="middle" font-size="11" font-weight="700" fill="#111">${b.toFixed(1)}</text>`;}
    for(const m of (o.markers||[])){const mx=Math.max(x0,Math.min(x1,m.x));
      s+=`<line x1="${X(mx)}" x2="${X(mx)}" y1="${padT}" y2="${H-padB}" stroke="#111" stroke-opacity=".25" stroke-dasharray="3 3"/><circle cx="${X(mx)}" cy="${Y(m.y)}" r="11" fill="#111" stroke="#fff" stroke-width="2"/><text x="${X(mx)}" y="${Y(m.y)+4.5}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${m.n}</text>`;}
    s+=`<g class="xh" style="display:none"><line y1="${padT}" y2="${H-padB}" stroke="#111" stroke-opacity=".5"/><circle r="4.5" fill="${c}" stroke="#fff" stroke-width="2"/></g>`;
  }
  return s+'</svg>';
}
function bindHover(box,out){
  const mv=e=>{
    const svg=box.querySelector('svg.ch');if(!svg||!CUR)return;
    const r=svg.getBoundingClientRect(),W=+svg.dataset.w,H=+svg.dataset.h,padL=58,padR=20,padT=24,padB=34;
    const x0=+svg.dataset.x0,x1=+svg.dataset.x1,lo=+svg.dataset.lo,hi=+svg.dataset.hi;
    const px=(e.clientX-r.left)/r.width*W;let x=x0+(px-padL)/(W-padL-padR)*(x1-x0);x=Math.max(x0,Math.min(x1,x));
    const a=pnl(CUR.B,x,0),b=pnl(CUR.B,x,P.f);
    const X=padL+(x-x0)/(x1-x0)*(W-padL-padR),Y=padT+(hi-a)/(hi-lo)*(H-padT-padB);
    const g=svg.querySelector('.xh'),l=g.children[0],d=g.children[1];
    g.style.display='';l.setAttribute('x1',X);l.setAttribute('x2',X);d.setAttribute('cx',X);d.setAttribute('cy',Y);
    out.innerHTML=`標的價 <b>${x.toFixed(1)}</b>（${sgn((x/P.S-1)*100,1)}%）　到期損益 <b class="${a>=0?'pos':'neg'}">${sgn(a*P.mult)}</b>　理論現值損益（剩餘 ${Math.round(P.f*100)}%）<b class="${b>=0?'pos':'neg'}">${sgn(b*P.mult)}</b>`;};
  box.addEventListener('pointermove',mv);box.addEventListener('pointerdown',mv);
  box.addEventListener('pointerleave',()=>{const g=box.querySelector('.xh');if(g)g.style.display='none';});
}
function scenarios(B){
  const S0=P.S,lo=S0*0.8,hi=S0*1.2;let by=-1e18,xa=S0,xb=S0;
  for(let i=0;i<=400;i++){const x=lo+(hi-lo)*i/400,y=pnl(B,x,0);
    if(y>by+1e-9){by=y;xa=xb=x;}else if(Math.abs(y-by)<=1e-9)xb=x;}
  const bx=(xa+xb)/2;
  return [{k:'w',n:1,name:'獲利情境',sub:'±20% 內的最佳價位',x:bx},{k:'d',n:2,name:'下跌情境',sub:'下跌 10%',x:S0*0.9},
          {k:'f',n:3,name:'橫盤情境',sub:'價格不變',x:S0},{k:'u',n:4,name:'大漲情境',sub:'上漲 10%',x:S0*1.1}]
    .map(s=>({...s,y:pnl(B,s.x,0)}));
}

function update(){
  const st=BYID[S.id],c=CATBY[st.cat].c,B=build(st,S.stage);CUR={st,B};
  const stt=stats(B),np=netPrem(B),gk=netGreeks(B),m=P.mult,hasStock=B.legs.some(o=>o.t==='S');

    <div class="fact"><small>最大虧損（模型）</small><b class="neg">${stt.unlLoss?'無限':fmt(stt.mn*m)}</b></div>
    <div class="fact"><small>損益兩平</small><b>${stt.be.length?stt.be.map(b=>b.toFixed(1)).join(' / '):'—'}</b></div>`;
  $('chart1').innerHTML=chartSVG(B,c,{});
  const sc=scenarios(B);
  $('chart2').innerHTML=chartSVG(B,c,{markers:sc});
  $('legs').innerHTML=`<tr><th>方向</th><th>類型</th><th>履約價</th><th>口</th><th>權利金</th><th>到期</th></tr>`+B.legs.map(o=>o.t==='S'?
    `<tr><td><span class="tag buy">持有</span></td><td>現股</td><td>成本 ${o.cost}</td><td>${o.q}</td><td>—</td><td>—</td></tr>`:
    `<tr><td><span class="tag ${o.s>0?'buy':'sell'}">${o.s>0?'買進':'賣出'}</span></td><td>${o.t==='C'?'Call':'Put'}</td><td>${o.K}</td><td>${o.q}</td><td>${fmt(o.price)}</td><td>${o.far?'遠月 '+P.days*3+' 天':'近月 '+P.days+' 天'}</td></tr>`).join('');
  $('greeks').innerHTML=`<div><small>Delta</small><b>${gk.delta.toFixed(2)}</b></div><div><small>Gamma</small><b>${gk.gamma.toFixed(3)}</b></div><div><small>Theta／天</small><b>${gk.theta.toFixed(2)}</b></div><div><small>Vega／1% IV</small><b>${gk.vega.toFixed(2)}</b></div>`;
  $('ghint').textContent=[gk.delta>0.15?'Delta 為正：偏多':gk.delta<-0.15?'Delta 為負：偏空':'Delta 接近 0：方向中性',
    gk.theta>0.005?'Theta 為正：時間站在你這邊':gk.theta<-0.005?'Theta 為負：時間流逝對你不利':'Theta 近零',
    gk.vega>0.01?'Vega 為正：IV 上升有利':gk.vega<-0.01?'Vega 為負：IV 下降有利':'Vega 近零'].join('；')+'。';
  $('buildlegs').innerHTML=`<table class="legs"><tr><th>#</th><th>動作</th><th>內容</th><th>參考權利金（每股）</th></tr>`+B.legs.map((o,i)=>o.t==='S'?
    `<tr><td>${i+1}</td><td>持有</td><td>現股，成本 ${o.cost}（每口對應契約股數）</td><td>—</td></tr>`:
    `<tr><td>${i+1}</td><td><span class="tag ${o.s>0?'buy':'sell'}">${o.s>0?'買進':'賣出'}</span></td><td>${o.q} 口 ${o.t==='C'?'Call':'Put'}，履約價 ${o.K}，${o.far?'遠月 '+P.days*3+' 天':P.days+' 天'}</td><td>${fmt(o.price)}（每口約 ${fmt(o.price*m)}）</td></tr>`).join('')+
    `</table><p style="margin:8px 0 0;font-size:13px;color:var(--mute)">${np>=0?'整組淨支出':'整組淨收入'}約 ${fmt(Math.abs(np)*m)}${hasStock?'（不含持股成本）':''}。實際成交價依買賣價差而定，建議以價差單掛限價。</p>`;
  const dt=DETAIL[st.id];
  $('scen').innerHTML=`<tr><th>#</th><th>情境</th><th>到期標的價</th><th>到期損益</th><th>發生什麼</th><th>怎麼處理</th></tr>`+sc.map(s=>{
    const [a,b]=dt.sc[s.k].split('|');
    return `<tr><td><span class="mkchip">${s.n}</span></td><td><b>${s.name}</b><br><span style="color:var(--mute);font-size:12px">${s.sub}</span></td><td>${s.x.toFixed(1)}<br><span style="color:var(--mute);font-size:12px">${sgn((s.x/P.S-1)*100,1)}%</span></td><td class="${s.y>=0?'pos':'neg'}"><b>${sgn(s.y*m)}</b></td><td>${a}</td><td>${b}</td></tr>`;}).join('');
}

/* ============ 對比表 ============ */
const CMP={sort:'cat',dir:1,cat:'',risk:'',out:'',q:''};
let cmpCache={k:'',rows:null};
function cmpRows(){
  const k=JSON.stringify([P.S,P.iv,P.days,P.step]);if(cmpCache.k===k)return cmpCache.rows;
  const rows=ST.map(st=>{const B=build(st,0),t=stats(B,1200),g=netGreeks(B);
    return {st,B,mx:t.unlProfit?Infinity:t.mx,mn:t.unlLoss?-Infinity:t.mn,np:netPrem(B),delta:g.delta,theta:g.theta,vega:g.vega};});
  cmpCache={k,rows};return rows;
}
function renderCmp(){
  const f=$('cmp-filter');
  if(!f.dataset.init){f.dataset.init=1;
    f.innerHTML=`<input id="cq" class="search" style="max-width:240px;margin:0" placeholder="搜尋策略名稱">
    <select id="cc"><option value="">全部類別</option>${CATS.map(c=>`<option value="${c.id}">${c.n}</option>`).join('')}</select>
    <select id="co"><option value="">全部行情</option>${OUT.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>
    <select id="cr"><option value="">全部風險</option><option value="limited">風險有限</option><option value="unlimited">含無限風險</option></select>
    <button class="chip" id="cx">重設</button>`;
    $('cq').oninput=e=>{CMP.q=e.target.value;renderCmp();};$('cc').onchange=e=>{CMP.cat=e.target.value;renderCmp();};
    $('co').onchange=e=>{CMP.out=e.target.value;renderCmp();};$('cr').onchange=e=>{CMP.risk=e.target.value;renderCmp();};
    $('cx').onclick=()=>{Object.assign(CMP,{cat:'',risk:'',out:'',q:'',sort:'cat',dir:1});$('cq').value='';$('cc').value='';$('co').value='';$('cr').value='';renderCmp();};}
  const key={en:r=>r.st.en,cat:r=>CATS.findIndex(c=>c.id===r.st.cat),risk:r=>r.st.risk==='limited'?0:1,mx:r=>r.mx,mn:r=>r.mn,np:r=>r.np,delta:r=>r.delta,theta:r=>r.theta,vega:r=>r.vega,iv:r=>r.st.iv};
  let rows=cmpRows().filter(r=>(!CMP.cat||r.st.cat===CMP.cat)&&(!CMP.risk||r.st.risk===CMP.risk)&&(!CMP.out||r.st.outlooks.includes(CMP.out))&&
    (!CMP.q||(r.st.en+r.st.zh).toLowerCase().includes(CMP.q.toLowerCase())));
  const kf=key[CMP.sort]||key.cat;
  rows=rows.slice().sort((a,b)=>{const x=kf(a),y=kf(b);return (x<y?-1:x>y?1:0)*CMP.dir;});
  const m=P.mult,col=(k,t)=>`<th class="sort" data-k="${k}">${t}${CMP.sort===k?(CMP.dir>0?' ▲':' ▼'):''}</th>`;
  const arrow=v=>v>0.005?'+'+v.toFixed(2):v<-0.005?v.toFixed(2):'0';
  $('cmp-table').innerHTML=`<tr>${col('en','策略')}${col('cat','類別')}<th>適用行情</th>${col('risk','風險')}${col('mx','最大獲利')}${col('mn','最大虧損')}${col('np','淨支出（+）／收入（−）')}${col('delta','Delta')}${col('theta','Theta／天')}${col('vega','Vega')}${col('iv','IV 偏好')}<th>損益圖</th></tr>`+
   rows.map(r=>{const c=CATBY[r.st.cat];return `<tr data-id="${r.st.id}"><td><b>${r.st.en}</b><br><span style="color:var(--mute);font-size:12px">${r.st.zh}</span></td><td style="color:${c.c};font-weight:700">${c.n}</td>
    <td style="font-size:12.5px">${r.st.outlooks.map(o=>OUTLBL[o]).join('、')}</td><td>${RISKTXT[r.st.risk]}</td>
    <td class="pos">${isFinite(r.mx)?sgn(r.mx*m):'無限'}</td><td class="neg">${isFinite(r.mn)?fmt(r.mn*m):'無限'}</td><td>${sgn(r.np*m)}</td>
    <td>${arrow(r.delta)}</td><td>${arrow(r.theta)}</td><td>${arrow(r.vega)}</td><td>${r.st.iv==='buy'?'偏買方':r.st.iv==='sell'?'偏賣方':'中性'}</td>
    <td style="width:130px"><div style="width:120px">${chartSVG(r.B,c.c,{mini:true,W:240,H:80})}</div></td></tr>`;}).join('')||'<tr><td colspan="12">沒有符合的策略</td></tr>';
  $('cmp-table').querySelectorAll('th.sort').forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(CMP.sort===k)CMP.dir*=-1;else{CMP.sort=k;CMP.dir=1;}renderCmp();});
  $('cmp-table').querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>go(r.dataset.id));
}

/* ============ 選擇器 ============ */
const SEL={out:'mildUp',iv:'unsure',risk:'any'};
function chips(id,items,key){
  $(id).innerHTML=items.map(([v,t])=>`<button class="chip${SEL[key]===v?' on':''}" data-v="${v}">${t}</button>`).join('');
  $(id).querySelectorAll('.chip').forEach(b=>b.onclick=()=>{SEL[key]=b.dataset.v;renderPick();});
}
function renderPick(){
  chips('pk-out',OUT,'out');
  chips('pk-iv',[['high','IV 偏高（權利金貴）'],['low','IV 偏低（權利金便宜）'],['unsure','不確定']],'iv');
  chips('pk-risk',[['limited','只要風險有限'],['any','都可以']],'risk');
  let list=ST.filter(s=>s.outlooks.includes(SEL.out));
  if(SEL.risk==='limited')list=list.filter(s=>s.risk==='limited');
  list=list.map(s=>{let sc=1+(s.star?0.5:0);const why=[];
    if(SEL.iv==='high'){if(s.iv==='sell'){sc+=1;why.push('IV 高：賣方佔優，權利金豐厚');}else if(s.iv==='buy'){sc-=1;why.push('IV 高：買方成本偏貴');}}
    if(SEL.iv==='low'){if(s.iv==='buy'){sc+=1;why.push('IV 低：買方成本便宜');}else if(s.iv==='sell'){sc-=1;why.push('IV 低：賣方收得少');}}
    if(s.star)why.push('新手建議先學');
    return {s,sc,why};}).sort((a,b)=>b.sc-a.sc);
  $('pk-res').innerHTML=`<div class="card" style="background:var(--soft)"><b>${OUTLBL[SEL.out]}</b>：${OUT_NOTE[SEL.out]}</div>`+
   (list.length?list.map(({s,sc,why})=>{const c=CATBY[s.cat].c;
     return `<div class="rec" style="--c:${c}"><div style="flex:1;min-width:220px"><b>${s.en}（${s.zh}）</b>${sc>=2?' <span class="bd" style="--c:#15803d">推薦</span>':''}
       <p>${s.lead}</p><p style="color:var(--mute)">${RISKTXT[s.risk]}；${IVTXT[s.iv]}${why.length?'；'+why.join('；'):''}</p></div>
       <div class="mini">${chartSVG(build(s,0),c,{mini:true,W:300,H:120})}</div><button data-id="${s.id}">看詳解</button></div>`;}).join(''):'<div class="warn">沒有符合條件的策略，請放寬風險偏好。</div>');
  $('pk-res').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>go(b.dataset.id));
}

/* ============ 基礎觀念 ============ */
function renderBasic(){
  const mk=(legs,c,t,d)=>`<div class="card"><h3>${t}</h3><div class="chartbox">${chartSVG(buildLegs(legs),c,{mini:true,W:300,H:150})}</div><p style="margin:6px 0 0;font-size:13.5px">${d}</p></div>`;
  $('v-basic').innerHTML=`
  <div class="card"><h3>四種基本部位</h3><div class="basic-grid">
    ${mk([buy('C',0)],'#15803d','買進 Call（Long Call）','看漲。最大虧損為權利金；獲利無限。')}
    ${mk([sell('C',0)],'#b91c1c','賣出 Call（Short Call）','看不漲。最大獲利為權利金；虧損無限（裸賣）。')}
    ${mk([buy('P',0)],'#b91c1c','買進 Put（Long Put）','看跌。最大虧損為權利金；下跌賺錢。')}
    ${mk([sell('P',0)],'#15803d','賣出 Put（Short Put）','看不跌。最大獲利為權利金；下跌虧損大。')}
  </div></div>
  <div class="grid2">
   <div class="card"><h3>建議學習路徑</h3><ol class="pl" style="padding-left:22px">
    <li>買進 Call／買進 Put，並理解時間價值衰減與 IV 的影響。</li>
    <li>四個垂直價差（兩買兩賣）：風險有限、成本低。</li>
    <li>Covered Call、Cash Secured Put、Collar：持股相關。</li>
    <li>Iron Condor、Butterfly：區間策略。</li>
    <li>Straddle／Strangle、比例價差；最後才碰含裸賣的結構。</li></ol></div>
   <div class="card"><h3>核心原則</h3><ul class="pl">
    <li>買方要同時對「方向、時間、波動」。</li>
    <li>賣方勝率高但賺小賠大，必須控管風險。</li>
    <li>IV 高偏賣，IV 低偏買。</li>
    <li>價差策略用賣出的腿降低成本並限制風險。</li></ul></div>
  </div>
  <div class="card"><h3>名詞速查</h3><dl class="glos">
   <dt>權利金（Premium）</dt><dd>買方支付、賣方收取的價格，等於內含價值加時間價值。</dd>
   <dt>價內／價平／價外（ITM／ATM／OTM）</dt><dd>Call：標的高於履約價為價內；Put 相反。價外選擇權只有時間價值。</dd>
   <dt>Delta</dt><dd>標的變動 1 元，選擇權價格的約略變動；也可粗估到期價內機率。Call 介於 0 到 1，Put 介於 −1 到 0。</dd>
   <dt>Gamma</dt><dd>Delta 的變化速度。買方為正（越賺越快），賣方為負（越虧越快）。</dd>
   <dt>Theta</dt><dd>每天流失的時間價值。買方為負，賣方為正。</dd>
   <dt>Vega</dt><dd>IV 變動 1% 時價格的變動。買方為正，賣方為負。</dd>
   <dt>隱含波動率（IV）</dt><dd>市場對未來波動的定價。事件前常墊高、事件後回落（IV Crush）。</dd>
   <dt>指派與履約</dt><dd>美式選擇權可提前履約；台指選擇權（TXO）為歐式、現金結算，只在到期日結算。</dd>
   <dt>垂直、水平、對角價差</dt><dd>垂直為同到期日不同履約價；水平（日曆）為同履約價不同到期日；對角為兩者皆不同。</dd>
   <dt>Roll（展期）</dt><dd>平掉現有部位，再建立更遠到期日或不同履約價的新部位。</dd>
  </dl></div>
  <div class="warn"><b>風險提示：</b>裸賣風險極高，新手慎用；每個策略都有弱點，先理解損益結構再下單；留意流動性與到期日行為。</div>`;
}

/* ============ 檢視切換與初始化 ============ */
function showView(v){
  S.view=v;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  if(v==='cmp')renderCmp();if(v==='pick')renderPick();if(v==='basic')renderBasic();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{showView(b.dataset.v);window.scrollTo({top:0});});
$('side-toggle').onclick=()=>$('side').classList.toggle('open');
$('side').innerHTML='<input id="search" class="search" placeholder="搜尋策略（中文或英文）"><div id="side-list"></div>';
$('search').oninput=renderSide;
$('search').onkeydown=e=>{if(e.key==='Escape'){e.target.value='';renderSide();e.target.blur();}
  if(e.key==='Enter'){const f=$('side-list').querySelector('.sbtn');if(f)f.click();}};
document.addEventListener('keydown',e=>{
  const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();showView('cat');$('side').classList.add('open');$('search').focus();}
  else if(S.view==='cat'){
    if(e.key==='j')step(1);else if(e.key==='k')step(-1);
    else if(e.key>='1'&&e.key<='5')setTab(TABS[+e.key-1][0]);}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(BYID[h]&&h!==S.id)go(h);});
(function init(){const h=location.hash.slice(1);if(BYID[h])S.id=h;
  renderShell();update();renderSide();})();

</script>
