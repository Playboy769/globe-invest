<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>期權交易策略大全 · 互動學習</title>
<style>
:root{
  --ink:#111827;--ink2:#374151;--mute:#6b7280;--line:#e5e7eb;--bg:#fff;--soft:#f9fafb;
  --bull:#15803d;--bear:#b91c1c;--yield:#b45309;--hedge:#6d28d9;--neutral:#1d4ed8;--vol:#0f766e;
  --pos:#15803d;--neg:#b91c1c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header.top{padding:22px 20px 14px;border-bottom:1px solid var(--line);text-align:center}
header.top h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.04em}
header.top p{margin:6px 0 0;color:var(--mute);font-size:14px}
.tip{display:inline-block;margin-top:10px;background:#f3e8ff;color:#4c1d95;border-radius:8px;padding:5px 14px;font-weight:700;font-size:14px}
nav.tabs{display:flex;gap:6px;justify-content:center;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:20;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 18px;font-weight:700}
nav.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px}
.view{display:none}.view.on{display:block}

/* catalog layout */
.cat-layout{display:grid;grid-template-columns:290px 1fr;gap:22px;align-items:start}
@media(max-width:900px){.cat-layout{grid-template-columns:1fr}}
.side{position:sticky;top:62px;max-height:calc(100vh - 80px);overflow:auto;padding-right:4px}
@media(max-width:900px){.side{position:static;max-height:none}}
.cat-block{margin-bottom:14px}
.cat-title{font-weight:800;font-size:14px;padding:4px 10px;border-left:5px solid var(--c);color:var(--c);background:var(--soft);border-radius:0 6px 6px 0}
.cat-title small{color:var(--mute);font-weight:500;margin-left:6px}
.slist{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.sbtn{text-align:left;border:1px solid transparent;background:#fff;border-radius:8px;padding:5px 10px;line-height:1.35}
.sbtn:hover{background:var(--soft)}
.sbtn.on{border-color:var(--c);background:var(--soft);box-shadow:inset 3px 0 0 var(--c)}
.sbtn b{display:block;font-size:14px}.sbtn span{font-size:12px;color:var(--mute)}
.star{color:#d97706;font-size:12px;margin-left:4px}

/* detail */
.dhead{border-left:6px solid var(--c);padding:2px 0 2px 14px;margin-bottom:12px}
.dhead h2{margin:0;font-size:25px}
.dhead h2 small{font-size:15px;color:var(--mute);font-weight:500;margin-left:8px}
.dhead p{margin:4px 0 0;color:var(--ink2)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.bd{font-size:12px;font-weight:700;border:1px solid var(--c);color:var(--c);border-radius:999px;padding:1px 10px;background:#fff}
.bd.g{--c:#6b7280}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;background:#fff}
.card h3{margin:0 0 8px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media(max-width:700px){.facts{grid-template-columns:repeat(2,1fr)}}
.fact{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft)}
.fact small{display:block;color:var(--mute);font-size:12px}
.fact b{font-size:16px}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* controls */
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px;margin-bottom:10px}
.ctl label{font-size:12px;color:var(--mute);display:block}
.ctl .row{display:flex;align-items:center;gap:8px}
.ctl input[type=range]{flex:1;accent-color:var(--c)}
.ctl output{min-width:48px;text-align:right;font-weight:700;font-size:13px;color:var(--ink)}
select,input[type=number]{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;background:#fff}
.stagebar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.stagebar button{border:1px solid var(--c);border-radius:8px;background:#fff;padding:3px 12px;font-weight:700;color:var(--c)}
.stagebar button.on{background:var(--c);color:#fff}
.chartbox{border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff}
svg.ch{width:100%;height:auto;display:block;touch-action:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:4px 8px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
table.legs{width:100%;border-collapse:collapse;font-size:13.5px}
table.legs th,table.legs td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
table.legs th{color:var(--mute);font-weight:600;font-size:12px}
.tag{display:inline-block;border-radius:5px;padding:0 7px;font-size:12px;font-weight:700;color:#fff}
.tag.buy{background:var(--pos)}.tag.sell{background:var(--neg)}
ul.pl{margin:0;padding-left:18px}ul.pl li{margin:3px 0}
.pros li::marker{color:var(--pos)}.cons li::marker{color:var(--neg)}
.warn{background:#fff7ed;border:1px solid #fdba74;border-radius:10px;padding:10px 14px;color:#7c2d12}
.formula{font-family:Consolas,monospace;background:var(--soft);border-radius:6px;padding:1px 6px;font-size:13px}
.gk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.gk{grid-template-columns:repeat(2,1fr)}}
.gk div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
.gk small{display:block;color:var(--mute);font-size:12px}
.gk b{font-size:15px}
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.flow .st{flex:1;min-width:150px;border:2px solid var(--c);border-radius:10px;padding:8px 10px;background:#fff}
.flow .ar{align-self:center;font-size:20px;color:var(--mute)}

/* selector */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff;font-weight:700}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rec{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:10px 14px;margin-bottom:10px;background:#fff;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rec b{font-size:16px}.rec p{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
.rec button{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:4px 14px}
.mini{width:150px;height:60px;flex:none}

/* basics */
.basic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.glos dt{font-weight:800;margin-top:10px}.glos dd{margin:2px 0 0;color:var(--ink2)}
footer{color:var(--mute);font-size:12.5px;text-align:center;padding:30px 16px;border-top:1px solid var(--line)}
@media print{nav.tabs,.side{display:none}.cat-layout{display:block}}
</style>
</head>
<body>
<header class="top">
  <h1>期權交易策略大全</h1>
  <p>按：用途 ＋ 行情判斷 ＋ 風險結構 分類 · 28 種策略 · 即時損益圖</p>

</header>
<nav class="tabs">
  <button data-v="cat" class="on">策略圖鑑</button>
  <button data-v="pick">策略選擇器</button>
  <button data-v="basic">基礎觀念</button>
</nav>
<div class="wrap">
  <section id="v-cat" class="view on">
    <div class="cat-layout">
      <aside class="side" id="side"></aside>
      <main id="detail"></main>
    </div>
  </section>
  <section id="v-pick" class="view">
    <div class="card">
      <h3>① 你對行情的看法？</h3>
      <div class="chips" id="pk-out"></div>
      <h3>② 目前隱含波動率（IV）水位？</h3>
      <div class="chips" id="pk-iv"></div>
      <h3>③ 風險偏好？</h3>
      <div class="chips" id="pk-risk"></div>
    </div>
    <div id="pk-res"></div>
  </section>
  <section id="v-basic" class="view"></section>
</div>
<footer>僅供教學與資訊參考，非投資建議。模型為 Black-Scholes（歐式、無股息），實際報價因買賣價差、波動率偏斜與稅費而異。<br>裸賣選擇權風險極高，新手請先了解保證金、流動性與到期日行為再下單。</footer>

 strongUp:'強勢上漲：單買方或合成多頭可放大報酬。',mildUp:'溫和上漲：垂直價差、賣 Put 類策略更划算。',
 flat:'盤整：賣方、蝶式、鐵禿鷹吃時間價值。',mildDown:'溫和下跌：熊市價差。',strongDown:'強烈下跌：買 Put 或合成空頭。',
 bigMove:'大波動：買跨式、寬跨式或 Back Spread。',ownStock:'持股：Covered Call、保護性 Put、Collar。',income:'收租：賣權利金系列，注意風險結構。'
};

/* ============ 定價與損益 ============ */
const R_FREE=0.015;
const ncdf=x=>{const t=1/(1+0.2316419*Math.abs(x)),d=0.3989423*Math.exp(-x*x/2);
 const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p;};
const npdf=x=>Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
function bs(S,K,T,sig,type){
  if(T<=1e-9||sig<=0){return type==='C'?Math.max(S-K,0):Math.max(K-S,0);}
  const r=R_FREE,sq=sig*Math.sqrt(T),d1=(Math.log(S/K)+(r+sig*sig/2)*T)/sq,d2=d1-sq;
  return type==='C'?S*ncdf(d1)-K*Math.exp(-r*T)*ncdf(d2):K*Math.exp(-r*T)*ncdf(-d2)-S*ncdf(-d1);
}
function greeksOf(S,K,T,sig,type){
  const r=R_FREE,sq=sig*Math.sqrt(T),d1=(Math.log(S/K)+(r+sig*sig/2)*T)/sq,d2=d1-sq;
  const delta=type==='C'?ncdf(d1):ncdf(d1)-1,gamma=npdf(d1)/(S*sq),vega=S*npdf(d1)*Math.sqrt(T)/100;
  const th=(-(S*npdf(d1)*sig)/(2*Math.sqrt(T))-(type==='C'?1:-1)*r*K*Math.exp(-r*T)*(type==='C'?ncdf(d2):ncdf(-d2)))/365;
  return {delta,gamma,vega,theta:th};
}

const P={S:100,iv:25,days:30,step:5,mult:1,f:0.5};
let curId=ST[0].id,stageIdx=0;

function build(st){
  const legsDef=st.stages?st.stages[stageIdx].legs:st.legs;
  const base=Math.round(P.S/P.step)*P.step,Tn=P.days/365,Tf=Tn*3,sig=P.iv/100;
  const legs=legsDef.map(l=>{
    const o={...l};
    if(l.t==='S'){o.cost=base+l.k*P.step;o.price=0;}
    else{o.K=base+l.k*P.step;o.T0=l.far?Tf:Tn;o.price=bs(P.S,o.K,o.T0,sig,l.t);}
    return o;});
  return {legs,base,Tn,Tf,sig};
}
function legVal(o,S,f,B){
  const T=o.far?(B.Tf-B.Tn)+f*B.Tn:f*B.Tn;return bs(S,o.K,T,B.sig,o.t);
}
function pnl(B,S,f){
  let t=0;for(const o of B.legs){
    if(o.t==='S')t+=o.s*o.q*(S-o.cost);
    else t+=o.s*o.q*(legVal(o,S,f,B)-o.price);}
  return t;
}
function stats(B){
  const N=4000,hi=P.S*4,xs=[],ys=[];
  for(let i=0;i<=N;i++){const x=hi*(0.0005+i/N);xs.push(x);ys.push(pnl(B,x,0));}
  let mx=-1e18,mn=1e18;for(const y of ys){if(y>mx)mx=y;if(y<mn)mn=y;}
  const slope=(ys[N]-ys[N-40])/(xs[N]-xs[N-40]);
  const unlProfit=slope>1e-4,unlLoss=slope<-1e-4;
  const be=[];for(let i=1;i<=N;i++){if((ys[i-1]<0&&ys[i]>=0)||(ys[i-1]>0&&ys[i]<=0)){
    const t=ys[i-1]/(ys[i-1]-ys[i]);be.push(xs[i-1]+t*(xs[i]-xs[i-1]));}}
  return {mx,mn,unlProfit,unlLoss,be};
}
function netPrem(B){let t=0;for(const o of B.legs){if(o.t!=='S')t+=o.s*o.q*o.price;}return t;}
function netGreeks(B){
  const g={delta:0,gamma:0,theta:0,vega:0};
  for(const o of B.legs){
    if(o.t==='S'){g.delta+=o.s*o.q;continue;}
    const gg=greeksOf(P.S,o.K,o.T0,B.sig,o.t);
    for(const k in g)g[k]+=o.s*o.q*gg[k];
  }
  return g;
}

/* ============ 繪圖 ============ */
function fmt(n,d=2){return (Math.abs(n)>=1000?n.toLocaleString('en-US',{maximumFractionDigits:0}):n.toFixed(d));}
function chartSVG(st,B,c,W=760,H=380,opts={}){
  const mini=opts.mini,padL=mini?6:58,padR=mini?6:20,padT=mini?6:22,padB=mini?6:34;
  const x0=P.S*0.7,x1=P.S*1.3,N=160;
  const exp=[],th=[];let lo=0,hi=0;
  for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N;const a=pnl(B,x,0),b=mini?a:pnl(B,x,P.f);
    exp.push([x,a]);th.push([x,b]);lo=Math.min(lo,a,b);hi=Math.max(hi,a,b);}
  if(hi===lo){hi=1;lo=-1;}const pad=(hi-lo)*0.12;lo-=pad;hi+=pad;
  const X=x=>padL+(x-x0)/(x1-x0)*(W-padL-padR),Y=y=>padT+(hi-y)/(hi-lo)*(H-padT-padB),y0=Y(0);
  const path=a=>a.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  const area=path(exp)+`L${X(x1)} ${y0}L${X(x0)} ${y0}Z`;
  const id='cp'+Math.random().toString(36).slice(2,7);
  let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" ${opts.mini?'':'id="mainchart"'}>`;
  s+=`<defs><clipPath id="${id}u"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath><clipPath id="${id}d"><rect x="0" y="${y0}" width="${W}" height="${H}"/></clipPath></defs>`;
  if(!mini){
    for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);
      s+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#eef0f3"/><text x="${padL-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#6b7280">${fmt(v*P.mult,0)}</text>`;}
    for(let i=0;i<=6;i++){const v=x0+(x1-x0)*i/6;
      s+=`<text x="${X(v)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#6b7280">${v.toFixed(0)}</text>`;}
  }
  s+=`<path d="${area}" fill="#16a34a" opacity=".16" clip-path="url(#${id}u)"/><path d="${area}" fill="#dc2626" opacity=".16" clip-path="url(#${id}d)"/>`;
  s+=`<line x1="${padL}" x2="${W-padR}" y1="${y0}" y2="${y0}" stroke="#111" stroke-width="1.2"/>`;
  if(!mini){
    s+=`<path d="${path(th)}" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-dasharray="6 5"/>`;
    s+=`<line x1="${X(P.S)}" x2="${X(P.S)}" y1="${padT}" y2="${H-padB}" stroke="#374151" stroke-width="1" stroke-dasharray="2 4"/><text x="${X(P.S)}" y="${padT-6}" text-anchor="middle" font-size="11" fill="#374151">現價 ${P.S}</text>`;
    for(const o of B.legs){if(o.t==='S')continue;if(o.K<x0||o.K>x1)continue;
      s+=`<line x1="${X(o.K)}" x2="${X(o.K)}" y1="${H-padB}" y2="${H-padB-7}" stroke="${o.s>0?'#15803d':'#b91c1c'}" stroke-width="3"/>`;}
  }
  s+=`<path d="${path(exp)}" fill="none" stroke="${c}" stroke-width="${mini?2:3}" stroke-linejoin="round"/>`;
  if(!mini){
    const stt=stats(B);
    for(const b of stt.be){if(b<x0||b>x1)continue;
      s+=`<circle cx="${X(b)}" cy="${y0}" r="5.5" fill="#fff" stroke="#111" stroke-width="2"/><text x="${X(b)}" y="${y0-10}" text-anchor="middle" font-size="11" font-weight="700" fill="#111">${b.toFixed(1)}</text>`;}
    s+=`<g id="xh" style="display:none"><line id="xhl" y1="${padT}" y2="${H-padB}" stroke="#111" stroke-opacity=".5"/><circle id="xhc" r="4.5" fill="${c}" stroke="#fff" stroke-width="2"/></g>`;
  }
  return s+'</svg>';
}
function attachHover(st,B,c){
  const svg=document.getElementById('mainchart');if(!svg)return;
  const W=760,padL=58,padR=20,x0=P.S*0.7,x1=P.S*1.3,out=document.getElementById('hov');
  const g=svg.querySelector('#xh'),l=svg.querySelector('#xhl'),dot=svg.querySelector('#xhc');
  const move=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;
    let x=x0+(px-padL)/(W-padL-padR)*(x1-x0);x=Math.max(x0,Math.min(x1,x));
    const a=pnl(B,x,0),b=pnl(B,x,P.f),hh=svg.viewBox.baseVal.height;
    const lo=chartRange.lo,hi=chartRange.hi,Y=y=>22+(hi-y)/(hi-lo)*(hh-22-34);
    const X=padL+(x-x0)/(x1-x0)*(W-padL-padR);
    g.style.display='';l.setAttribute('x1',X);l.setAttribute('x2',X);dot.setAttribute('cx',X);dot.setAttribute('cy',Y(a));
    out.innerHTML=`標的價 <b>${x.toFixed(1)}</b>　到期損益 <b class="${a>=0?'pos':'neg'}">${a>=0?'+':''}${fmt(a*P.mult)}</b>　理論現值損益（剩餘 ${Math.round(P.f*100)}%）<b class="${b>=0?'pos':'neg'}">${b>=0?'+':''}${fmt(b*P.mult)}</b>`;};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{g.style.display='none';});
}
let chartRange={lo:0,hi:0};
function computeRange(B){
  const x0=P.S*0.7,x1=P.S*1.3;let lo=0,hi=0;
  for(let i=0;i<=160;i++){const x=x0+(x1-x0)*i/160;const a=pnl(B,x,0),b=pnl(B,x,P.f);lo=Math.min(lo,a,b);hi=Math.max(hi,a,b);}
  if(hi===lo){hi=1;lo=-1;}const pad=(hi-lo)*0.12;chartRange={lo:lo-pad,hi:hi+pad};
}

function greekHint(g){
  const t=[];
  t.push(g.delta>0.15?'Delta 為正：偏多':g.delta<-0.15?'Delta 為負：偏空':'Delta 接近 0：方向中性');
  t.push(g.theta>0.005?'Theta 為正：時間站在你這邊':g.theta<-0.005?'Theta 為負：時間流逝對你不利':'Theta 近零');
  t.push(g.vega>0.01?'Vega 為正：IV 上升有利':g.vega<-0.01?'Vega 為負：IV 下降有利':'Vega 近零');
  return t.join('；')+'。';
}

  $('pk-res').innerHTML=`<div class="card" style="background:var(--soft)"><b>${OUT.find(o=>o[0]===SEL.out)[1]}</b>：${OUT_NOTE[SEL.out]}</div>`+
   (list.length?list.map(({s,sc,why})=>{const c=CATS.find(x=>x.id===s.cat).c,B0=build(s);
     return `<div class="rec" style="--c:${c}"><div style="flex:1;min-width:220px"><b>${s.en}（${s.zh}）</b>${sc>=2?' <span class="bd" style="--c:#15803d">推薦</span>':''}
       <p>${s.lead}</p><p style="color:var(--mute)">${RISKTXT[s.risk]} · ${IVTXT[s.iv]}${why.length?' · '+why.join('；'):''}</p></div>
       <div class="mini">${chartSVG(s,B0,c,300,120,{mini:true})}</div><button data-id="${s.id}">看詳解</button></div>`;}).join(''):'<div class="warn">沒有符合條件的策略，請放寬風險偏好。</div>');
  $('pk-res').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>go(b.dataset.id));
}

/* ============ 基礎觀念 ============ */
function renderBasic(){
  const four=[['long-call','買 Call','買方｜看漲'],['long-put','買 Put','買方｜看跌']].map(x=>BYID[x[0]]);
  const sellers=[{...BYID['csp'],_n:'賣 Put'}];
  const mk=(legs,c,t,d)=>{const old=P.f;const B={legs:legs.map(l=>{const o={...l};if(l.t==='S'){o.cost=100;o.price=0;}else{o.K=100+l.k*5;o.T0=30/365;o.price=bs(100,o.K,o.T0,.25,l.t);}return o;}),Tn:30/365,Tf:90/365,sig:.25};
    const sv=P.S;P.S=100;const h=`<div class="card"><h3>${t}</h3><div class="chartbox">${chartSVG({}, B, c, 300,150,{mini:true})}</div><p style="margin:6px 0 0;font-size:13.5px">${d}</p></div>`;P.S=sv;return h;};
  $('v-basic').innerHTML=`
  <div class="card"><h3>四種基本部位（Long / Short × Call / Put）</h3>
   <div class="basic-grid">
    ${mk([buy('C',0)],'#15803d','買 Call（Long Call）','看漲。最大虧損＝權利金；獲利無限。')}
    ${mk([sell('C',0)],'#b91c1c','賣 Call（Short Call）','看不漲。最大獲利＝權利金；虧損無限（裸賣）。')}
    ${mk([buy('P',0)],'#b91c1c','買 Put（Long Put）','看跌。最大虧損＝權利金；下跌賺錢。')}
    ${mk([sell('P',0)],'#15803d','賣 Put（Short Put）','看不跌。最大獲利＝權利金；下跌虧損大。')}
   </div></div>
  <div class="grid2">
   <div class="card"><h3>學習路徑建議</h3><ol class="pl" style="padding-left:22px">
    <li>先吃透「買 Call / 買 Put」與時間價值衰減。</li>
    <li>學「四個垂直價差」：兩買兩賣，風險有限、成本低。</li>
    <li>進階到「Covered Call、Cash Secured Put、Collar」。</li>
    <li>再學「Iron Condor、Butterfly」等區間策略。</li>
    <li>最後才碰「Straddle/Strangle」與「裸賣」類。</li></ol></div>
   <div class="card"><h3>選擇權口訣</h3><ul class="pl">
    <li>買方：<b>方向 ＋ 時間 ＋ 波動</b>都要對。</li>
    <li>賣方：<b>勝率高、賺小賠大</b>，必須控風險。</li>
    <li>IV 高 → 偏賣；IV 低 → 偏買。</li>
    <li>價差策略＝用賣出的腿「降低成本」並「限制風險」。</li></ul></div>
  </div>
  <div class="card"><h3>名詞速查</h3><dl class="glos">
   <dt>權利金 Premium</dt><dd>買方付、賣方收的選擇權價格。＝內含價值 ＋ 時間價值。</dd>
   <dt>價內 / 價平 / 價外（ITM / ATM / OTM）</dt><dd>Call：標的 > 履約價為價內；Put 相反。價外選擇權只有時間價值。</dd>
   <dt>Delta</dt><dd>標的漲 1 元，選擇權約變動多少；也是「到期價內機率」的粗略估計。Call 為 0~1，Put 為 −1~0。</dd>
   <dt>Gamma</dt><dd>Delta 的變化速度。買方為正（越賺越快），賣方為負（越虧越快）。</dd>
   <dt>Theta</dt><dd>每天流失的時間價值。買方為負（付錢給時間），賣方為正（賺時間）。</dd>
   <dt>Vega</dt><dd>IV 變動 1% 時價格的變動。買方為正，賣方為負。</dd>
   <dt>隱含波動率 IV</dt><dd>市場對未來波動的「定價」。事件前常墊高、事件後崩落（IV Crush）。</dd>
   <dt>指派 / 履約 Assignment / Exercise</dt><dd>美式可提前履約；台指選擇權（TXO）為歐式、現金結算，只在到期日。</dd>
   <dt>垂直 / 水平 / 對角價差</dt><dd>垂直＝同到期日不同履約價；水平（日曆）＝同履約價不同到期日；對角＝兩者都不同。</dd>
   <dt>Roll（展期）</dt><dd>平掉現有部位，再建立更遠或更不同履約價的新部位。</dd>
  </dl></div>
  <div class="warn"><b>風險提示：</b>裸賣風險極高，新手慎用；策略皆有弱點，先了解再交易；留意選擇權流動性與到期日；先理解盈虧結構，再下單。</div>`;
}

/* ============ 切換 ============ */
function showView(v){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  try{localStorage.setItem('osg-view',v);}catch(e){}
  if(v==='pick')renderPick();if(v==='basic')renderBasic();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>showView(b.dataset.v));
const h=location.hash.slice(1);if(BYID[h])curId=h;
renderSide();renderDetail();
</script>
